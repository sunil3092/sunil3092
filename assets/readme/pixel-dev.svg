<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 108 80" shape-rendering="crispEdges" role="img" aria-label="Pixel art of Sunil typing code at a laptop"><title>Pixel art of Sunil typing code at a laptop</title><style>
.px-hand{animation:type .45s step-end infinite}
.px-hand-b{animation-delay:.22s}
.px-code-type{transform-box:fill-box;transform-origin:left center;animation:code 2.4s step-end infinite}
.px-cursor{animation:blink .9s step-end infinite}
.px-steam{opacity:0;animation:rise 2.4s steps(10) infinite}
