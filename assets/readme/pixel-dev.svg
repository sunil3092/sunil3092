@keyframes code{0%{transform:scaleX(.15)}25%{transform:scaleX(.45)}50%{transform:scaleX(.7)}75%{transform:scaleX(1)}100%{transform:scaleX(.15)}}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.75}100%{transform:translateY(-10px);opacity:0}}
@keyframes bob{0%,92%{transform:translateY(0)}94%,98%{transform:translateY(1px)}100%{transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.px-steam{opacity:0}}
